stages:
  - verify
  - analyze
  - images
  - deploy

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "dev"'

variables:
  COMPOSE_PROJECT_NAME: "etsopy"
  IMAGE_TAG: "$CI_COMMIT_SHA"
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  DOCKER_BUILDKIT: "1"
  BUILDX_NO_DEFAULT_ATTESTATIONS: "1"

verify:maven:
  stage: verify
  image: maven:3.9.9-eclipse-temurin-17
  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"
  cache:
    key: "maven-$CI_PROJECT_ID"
    paths:
      - .m2/repository/
  script:
    - mvn --batch-mode --no-transfer-progress clean verify
  artifacts:
    when: always
    reports:
      junit:
        - "**/target/surefire-reports/TEST-*.xml"
        - "**/target/failsafe-reports/TEST-*.xml"
    expire_in: 30 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "dev"'

analyze:sonarqube:
  stage: analyze
  image: maven:3.9.9-eclipse-temurin-17
  needs:
    - verify:maven
  cache:
    key: "maven-$CI_PROJECT_ID"
    paths:
      - .m2/repository/
  script:
    - >-
      mvn --batch-mode --no-transfer-progress -DskipTests package sonar:sonar
      -Dsonar.projectKey="$CI_PROJECT_PATH_SLUG"
      -Dsonar.host.url="$SONAR_HOST_URL"
      -Dsonar.token="$SONAR_TOKEN"
  allow_failure: true
  rules:
    - if: '$SONAR_HOST_URL && $SONAR_TOKEN && ($CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH)'

images:publish:
  stage: images
  image: docker:29-cli
  needs:
    - verify:maven
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - |
      set -eu
      services="eureka-server api-gateway core-service project-service event-service portfolio-service analytics-service rating-service partner-service admin-service document-service"
      for service in $services; do
        image="$CI_REGISTRY_IMAGE/$service"
        docker build --pull --provenance=false -f "$service/Dockerfile" -t "$image:$CI_COMMIT_SHA" -t "$image:latest" .
        docker push "$image:$CI_COMMIT_SHA"
        docker push "$image:latest"
      done
  after_script:
    - docker logout "$CI_REGISTRY" || true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

deploy:production:
  stage: deploy
  tags:
    - etsopy-deploy
  needs:
    - images:publish
  resource_group: etsopy-production
  environment:
    name: production
    url: https://etsopy.kseoni.ch
  variables:
    DEPLOY_DIR: "/srv/app/etsopy"
  before_script:
    - test -n "$ETSOPY_PROD_ENV"
    - test -f "$ETSOPY_PROD_ENV"
    - |
      set -eu
      required="DB_USERNAME DB_PASSWORD RABBITMQ_USERNAME RABBITMQ_PASSWORD MINIO_ACCESS_KEY MINIO_SECRET_KEY JWT_SECRET JWT_EXPIRATION JWT_REFRESH_EXPIRATION JWT_ISSUER_URI GF_SECURITY_ADMIN_USER GF_SECURITY_ADMIN_PASSWORD"
      for name in $required; do
        grep -Eq "^${name}=.+$" "$ETSOPY_PROD_ENV" || {
          echo "Missing required variable in ETSOPY_PROD_ENV: $name" >&2
          exit 1
        }
      done
      if grep -Eq '^[[:space:]]*[A-Za-z_][A-Za-z0-9_]*=.*changeme_' "$ETSOPY_PROD_ENV"; then
        echo "ETSOPY_PROD_ENV still contains changeme_* placeholders" >&2
        exit 1
      fi
      jwt_secret=$(sed -n 's/^JWT_SECRET=//p' "$ETSOPY_PROD_ENV" | tail -n 1 | tr -d '\r')
      if [ "${#jwt_secret}" -lt 32 ]; then
        echo "JWT_SECRET must contain at least 32 characters" >&2
        exit 1
      fi
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - install -d -m 700 "$DEPLOY_DIR"
    - install -d -m 700 "$DEPLOY_DIR/infrastructure/docker/postgres"
    - install -d -m 700 "$DEPLOY_DIR/infrastructure/docker/prometheus"
    - install -d -m 700 "$DEPLOY_DIR/infrastructure/docker/grafana/provisioning"
    - install -d -m 700 "$DEPLOY_DIR/infrastructure/docker/grafana/dashboards"
    - |
      set -eu
      umask 077
      temporary_env="$DEPLOY_DIR/.env.$CI_JOB_ID.tmp"
      trap 'rm -f "$temporary_env"' EXIT
      sed -e 's/\r$//' -e '/^REGISTRY_IMAGE=/d' -e '/^IMAGE_TAG=/d' "$ETSOPY_PROD_ENV" > "$temporary_env"
      printf '\nREGISTRY_IMAGE=%s\nIMAGE_TAG=%s\n' "$CI_REGISTRY_IMAGE" "$CI_COMMIT_SHA" >> "$temporary_env"
      chmod 600 "$temporary_env"
      mv -f "$temporary_env" "$DEPLOY_DIR/.env"
      trap - EXIT
    - install -m 600 docker-compose.prod.yml "$DEPLOY_DIR/docker-compose.prod.yml"
    - install -m 600 infrastructure/docker/postgres/init-databases.sql "$DEPLOY_DIR/infrastructure/docker/postgres/init-databases.sql"
    - install -m 600 infrastructure/docker/prometheus/prometheus.yml "$DEPLOY_DIR/infrastructure/docker/prometheus/prometheus.yml"
    - cp -R infrastructure/docker/grafana/provisioning/. "$DEPLOY_DIR/infrastructure/docker/grafana/provisioning/"
    - cp -R infrastructure/docker/grafana/dashboards/. "$DEPLOY_DIR/infrastructure/docker/grafana/dashboards/"
    - cd "$DEPLOY_DIR"
    - docker compose -f docker-compose.prod.yml config --quiet
    - docker compose -f docker-compose.prod.yml pull
    - docker compose -f docker-compose.prod.yml up -d --wait --wait-timeout 600 --remove-orphans
    - docker compose -f docker-compose.prod.yml ps
    - curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 http://localhost:8080/actuator/health/readiness
    - |
      set -eu
      expected="core-service project-service event-service portfolio-service analytics-service rating-service partner-service admin-service document-service"
      for attempt in $(seq 1 30); do
        registry=$(curl --fail --silent --show-error -H 'Accept: application/json' http://localhost:8761/eureka/apps || true)
        missing=0
        for service in $expected; do
          echo "$registry" | grep -qi "\"name\":\"$service\"" || missing=1
        done
        if [ "$missing" -eq 0 ]; then
          exit 0
        fi
        sleep 5
      done
      echo "Not all services registered in Eureka within 150 seconds" >&2
      exit 1
  after_script:
    - docker logout "$CI_REGISTRY" || true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
  allow_failure: false
